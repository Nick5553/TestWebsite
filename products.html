<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All products · Nova Store</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232dd4bf'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="products">
  <header id="site-header" class="site-header"></header>

  <main id="main" class="container page" tabindex="-1">
    <div class="page-header">
      <h1 id="page-title" data-testid="page-title">All products</h1>
      <p id="result-count" class="muted" aria-live="polite" data-testid="result-count"></p>
    </div>

    <form id="filters" class="card filters" role="search" aria-label="Filter products" data-testid="filters">
      <div class="field field-search">
        <label for="search">Search</label>
        <input id="search" name="q" type="search" placeholder="Search by name or description…" autocomplete="off" data-testid="search-input">
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category" data-testid="category-filter">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="field">
        <label for="sort">Sort by</label>
        <select id="sort" name="sort" data-testid="sort-select">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name-asc">Name: A to Z</option>
          <option value="name-desc">Name: Z to A</option>
        </select>
      </div>
      <label class="checkbox">
        <input id="on-sale" name="sale" type="checkbox" data-testid="sale-filter">
        On sale only
      </label>
      <button type="reset" class="btn btn-ghost" data-testid="reset-filters">Clear filters</button>
    </form>

    <div id="product-grid" class="product-grid" data-testid="product-grid"></div>

    <div id="empty-state" class="empty-state" hidden data-testid="no-results">
      <div class="empty-state-icon" aria-hidden="true">🔍</div>
      <h2>No products match your filters</h2>
      <p>Try a different search term or category.</p>
      <button type="button" id="empty-reset" class="btn btn-secondary">Clear filters</button>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/storage.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/products.js"></script>
</body>
</html>
