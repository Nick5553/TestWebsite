<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product · Nova Store</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232dd4bf'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="product">
  <header id="site-header" class="site-header"></header>

  <main id="main" class="container page" tabindex="-1">
    <!-- Filled in by js/pages/product.js from ?id=... -->
    <div id="product-root" data-testid="product-root"></div>

    <section id="related" class="section" aria-labelledby="related-title" hidden>
      <div class="section-header">
        <h2 id="related-title">You might also like</h2>
      </div>
      <div id="related-grid" class="product-grid" data-testid="related-grid"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/storage.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/product.js"></script>
</body>
</html>
